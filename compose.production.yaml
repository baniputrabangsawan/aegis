name: aegis-control

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.production}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  migrate:
    image: aegis-control-migrator:${IMAGE_TAG:-latest}
    build:
      context: .
      target: migrator
    restart: "no"
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.production}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  app:
    image: aegis-control-app:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.production}
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?DASHBOARD_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - edge
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  backup:
    image: aegis-control-backup:${IMAGE_TAG:-latest}
    build:
      context: ./ops/postgres-backup
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.production}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_backups:/backups
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  postgres_backups:
  caddy_data:
  caddy_config:
